const STATUS_FONTES_RESUMO = "⚠️ 7 fontes com problema: Código Fonte TV (vazio), Tênis Além do Óbvio (vazio), Canal MangaQ (vazio), JBox (vazio), IGN Brasil (vazio), AnimeHunch (vazio), Dias de Nerd (vazio)";

// T-06: temas (id/label/emoji/cor) vêm de config/mural_temas.yaml via
// montar_temas_para_template() -- nav, cor da tag e mapa de nomes são
// montados a partir DESTA lista, não mais hardcoded aqui.
const TEMAS = [{"id": "ia", "label": "IA", "emoji": "🤖", "cor": "#00c2ff"}, {"id": "corinthians", "label": "Corinthians", "emoji": "⚽", "cor": "#00e572"}, {"id": "joao_fonseca", "label": "João Fonseca", "emoji": "🎾", "cor": "#ffe600"}, {"id": "hxh", "label": "Hunter x Hunter", "emoji": "🎌", "cor": "#ff3ea5"}];
const NOMES = {};
const CORES_TEMA = {};
TEMAS.forEach(t => { NOMES[t.id] = t.label; CORES_TEMA[t.id] = t.cor; });

const filtrosNav = document.getElementById("filtros");
TEMAS.forEach(t => {
  const btn = document.createElement("button");
  btn.className = "filtro";
  btn.dataset.tema = t.id;
  btn.textContent = (t.emoji ? t.emoji + " " : "") + t.label;
  filtrosNav.appendChild(btn);
});

const lidos = new Set();
let filtroAtual = "todos";

const grade = document.getElementById("grade");
const vazio = document.getElementById("vazio");
const contador = document.getElementById("contador");
const modal = document.getElementById("modal-repos");
const listaRepos = document.getElementById("lista-repos");
const avisoFontes = document.getElementById("aviso-fontes");

function renderRepos(){
  listaRepos.innerHTML = "";
  REPOSITORIOS.forEach((r, idx) => {
    const item = document.createElement("div");
    item.className = "repo-item";
    item.innerHTML = `
      <div class="repo-top">
        <a href="${r.url}" target="_blank" rel="noopener" class="repo-title">#${idx+1} ${r.name} ↗</a>
        <span class="repo-stars">★ ${r.stars}</span>
      </div>
      <p class="repo-desc">${r.desc}</p>
    `;
    listaRepos.appendChild(item);
  });
}

function abrirModal(){
  renderRepos();
  modal.classList.add("ativo");
}

function fecharModal(){
  modal.classList.remove("ativo");
}

function render(){
  grade.querySelectorAll(".card").forEach(c => c.remove());
  const visiveis = NOTICIAS.filter(n => filtroAtual === "todos" || n.tema === filtroAtual);
  visiveis.forEach(n => {
    const i = NOTICIAS.indexOf(n);
    const card = document.createElement("article");
    card.className = "card" + (lidos.has(i) ? " lido" : "");
    card.innerHTML = `
      <div class="card-topo">
        <span class="tag" style="background:${CORES_TEMA[n.tema] || '#ccc'}">${NOMES[n.tema] || n.tema}</span>
        ${n.principal ? '<span class="badge-principal">★ Destaque</span>' : ''}
      </div>
      ${n.thumbnail_url ? `<img class="card-thumb" src="${n.thumbnail_url}" alt="" loading="lazy">` : ''}
      <div class="card-corpo">
        <h2>${n.titulo}</h2>
        <p>${n.resumo}</p>
        <div class="meta">${n.fonte} — ${n.quando}</div>
      </div>
      <div class="card-acoes">
        <a href="${n.url}" ${n.isModal ? 'onclick="event.preventDefault(); abrirModal();"' : 'target="_blank" rel="noopener"'}>${n.isModal ? 'Ver 10 Repositórios ↗' : 'Ler na fonte ↗'}</a>
        <button data-idx="${i}">${lidos.has(i) ? "✓ Lido" : "Marcar como lido"}</button>
      </div>`;
    card.querySelector("button").addEventListener("click", e => {
      const idx = Number(e.target.dataset.idx);
      lidos.has(idx) ? lidos.delete(idx) : lidos.add(idx);
      render();
    });
    grade.appendChild(card);
  });
  vazio.style.display = visiveis.length ? "none" : "block";
  contador.textContent = `${NOTICIAS.length} notícias · ${lidos.size} lidas`;
}

document.getElementById("filtros").addEventListener("click", e => {
  if(!e.target.classList.contains("filtro")) return;
  document.querySelectorAll(".filtro").forEach(b => {
    b.classList.remove("ativo");
    b.style.background = "";
    b.style.color = "";
  });
  e.target.classList.add("ativo");
  filtroAtual = e.target.dataset.tema;
  // T-06: "todos" continua com a cor fixa do CSS (.filtro.ativo[data-tema="todos"]);
  // tema real usa a cor vinda de TEMAS_JSON (CORES_TEMA), via style inline.
  if (filtroAtual !== "todos" && CORES_TEMA[filtroAtual]) {
    e.target.style.background = CORES_TEMA[filtroAtual];
  }
  render();
});

// T-06: aviso discreto -- só aparece quando alguma fonte não veio "ok".
// O texto em si já vem pronto de resumo_status_texto() (Python); aqui só
// decide mostrar/esconder o bloco, sem duplicar a lógica de formatação.
const temFonteComProblema = Object.values(STATUS_FONTES).some(f => f.estado !== "ok");
if (temFonteComProblema && avisoFontes) {
  avisoFontes.textContent = STATUS_FONTES_RESUMO;
  avisoFontes.style.display = "block";
}

render();
